<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#07090E" />
    <meta name="description" content="Luz, tu asistente personal" />
    <title>Luz</title>
    <!-- Aplica el tema antes del primer pintado para evitar el parpadeo (FOUC). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('luz_theme')
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.setAttribute('data-theme', t)
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', t === 'dark' ? '#07090E' : '#F8FAFC')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
